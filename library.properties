sentence=Read air quality and gas concentration (ppm) from an MQ-135 sensor on Particle devices.
paragraph=Driver for the MQ-135 hazardous gas / air quality sensor. Converts the analog output to sensor resistance and gas concentration (CO2-equivalent ppm) using the datasheet curve, with temperature/humidity correction and a calibration helper. Tuned for the Particle 12-bit 3.3V ADC.
