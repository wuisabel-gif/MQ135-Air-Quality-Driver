author=wuisabel-gif <wuisabel@usc.edu>
sentence=Read air quality and gas concentration (ppm) from an MQ-135 sensor on Particle and Arduino.
paragraph=Driver for the MQ-135 hazardous gas / air quality sensor. Converts the analog output to sensor resistance and gas concentration (CO2-equivalent ppm) using the datasheet curve, with temperature/humidity correction and a calibration helper. Auto-selects the ADC resolution and reference for Particle (12-bit 3.3V) and classic Arduino (10-bit 5V); setADC() overrides for ESP32/SAMD or an external ADC.
